      video: v5l_IptxKSk
      summary: 금오메타유니버시티는 신입생들이나 입학 예정자들과 같이 아직 학교의 전경과 시설들의 위치를 잘 모르는 학생들을 위해 개발되었다. 이런 학생들이 학교에 오기 전에 미리 학교를 둘러보며 자신이 수업할 건물, 복지 시설 등을 구경하거나 체험할 수 있다.
