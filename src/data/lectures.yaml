    - title: 탈출 게임
      team: 1조 유니팀
      # video: CoXYucQHY7w  (YouTube에서 삭제 또는 비공개되어 재생 불가 — 다시 공개되면 주석 해제)
      summary: 유니티 엔진을 사용한 3D 탈출 게임이며, 화재 상황 교육 테마 및 좀비 서바이벌 멀티 테마를 선택하여 플레이가 가능하다. 화재 상황 교육 테마의 경우 실생활에서의 활용에 초점을 맞추어 개발하였으며, 좀비 서바이벌 멀티 테마의 경우 협동 요소에 초점을 맞추어 개발하였다.
