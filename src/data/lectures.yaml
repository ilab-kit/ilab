    - title: 버스 노선별 주요 정보 안내
      team: 5조 미숙
      video: In8eihiIbeA
      summary: 우리 앱은 금오공대와 구미역, 옥계동, 종합터미널을 지나는 모든 버스에 대한 도착정보를 알리는 기능과 인프라가 많은 버스 노선에 대한 추천 기능, 추천 노선의 주변에 존재하는 음식점 정보와 부동산 정보를 표시하는 기능을 포함하여 대학가 내에 거주하는 학생들에게 보다 더 많은 인프라를 누릴 수 있도록 돕고 대학가에 거주하지 않더라도 버스 도착 정보를 제공하여 버스를 기다리는 데 발생하는 시간적 손실을 감소시키는 것에 이바지 할 것이다.
      links:
