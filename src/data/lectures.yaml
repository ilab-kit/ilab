    - title: 온도 기반 스타일 추천
      team: 7조 카카오입사예정자들
      # video: hRqH1I6Y3WQ  (YouTube에서 삭제 또는 비공개되어 재생 불가 — 다시 공개되면 주석 해제)
      summary: 최근 간절기에 일교차가 매우 심하기도 하고 옷을 입을 때 습도나 체감온도 같이 여러가지 고려해야할 사항이 많다. "오뭐입?" 어플은 날씨, 온도, 습도에 따라서 사용자에게 적절한 옷차림과 필요하다면 아우터까지 추천해줄 수 있는 어플이다.
