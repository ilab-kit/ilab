    - title: 자취 백과사전
      team: 4조 모바일
      video: M32EwZc6X_E
      summary: 자취생들을 위해 만들어진 앱입니다. 자취 꿀팁 백과사전으로 가사의 효율성을 높여드리고자 합니다. 백과사전 기능뿐만 아니라 같은 자취생들과 정보를 주고받는 커뮤니티 기능을 제공하며, 주변 맛집 정보도 제공해드립니다.
