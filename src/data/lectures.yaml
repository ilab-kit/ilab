      video: YehQvPknIBM
      summary: 가상의 대학교를 배경으로 한 육성 시뮬레이터 게임. 학생을 직접 조작하여 여러 행동을 수행하고 수행한 행동을 바탕으로 스탯이 증감된다. 게임시간이 모두 경과되면 스탯의 변화 정도에 따라 다른 엔딩이 출력된다.
      links:
