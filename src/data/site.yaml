# Home page headline; the word in <...> is shown in the accent colour
headline: "<Touch>: sensed by robots, rendered for people."
tagline: Sensing touch for robots and rendering it for people.

heroKo: 피지컬 AI부터 XR까지, 로봇과 사람을 위한 촉각 기술을 연구합니다.

intro:
  en: >-
    We engineer the sense of touch so that robots can handle real objects and people can feel
    virtual ones. Our work spans four directions: Physical AI, where tactile sensing and learning
    models move robots toward touch-aware manipulation; soft robotics, from shape-adaptive gripper
    skins to varifocal lenses; stretchable haptic interfaces built from smart materials; and haptic
    rendering that turns virtual textures into touch for immersive XR (VR/AR/MR).
  ko: >-
    촉각은 로봇이 물리 세계를 다루는 데에도, 사람이 가상 세계를 실감하는 데에도 핵심이 되는 감각입니다.
    피지컬 AI 분야에서는 촉각 센싱과 학습 모델을 결합해, 접촉 정보를 활용하는 로봇 조작을 목표로 연구하고 있습니다.
    또한 형상 적응형 그리퍼 스킨과 가변 초점 렌즈 등 소프트 로보틱스를 연구하고, 스마트 소재로 신축성 햅틱
    센서·액추에이터를 만들며, 가상의 질감을 손끝에 전하는 햅틱 렌더링을 몰입형 XR(VR/AR/MR)에 적용합니다.

recruit:
  en: >-
    We are actively recruiting self-motivated M.S./Ph.D. students and undergraduate researchers
    interested in Physical AI and robot learning, immersive VR/AR, human-computer interaction,
    next-generation haptic interfaces, embedded systems, and soft robotics.
  ko: 피지컬 AI·로봇 학습, 몰입형 VR/AR 시스템, 인간-컴퓨터 상호작용, 차세대 촉각 인터페이스, 임베디드 시스템, 소프트 로보틱스를 함께 연구할 학부 연구생·대학원생을 모집합니다.

