# Lab-wide information shown on the home page, header and footer.

name: i Lab
fullName: Interaction Laboratory
ko: 인터랙션 연구실
university: Kumoh National Institute of Technology
universityKo: 국립금오공과대학교

tagline: Designing how people touch, feel and interact with the digital world.

intro:
  en: >-
    We develop next-generation user interfaces based on haptics for XR (VR/AR/MR) systems.
    To get there, we build haptic sensors and actuators from smart materials, develop haptic
    rendering methods, and construct immersive VR simulators and future robot interfaces such as
    shape-deformable varifocal lenses and shape-adaptive gripper skins.
  ko: >-
    XR(VR/AR/MR)을 위한 햅틱스 기반 차세대 사용자 인터페이스를 연구합니다.
    스마트 소재를 활용한 형상 가변 렌즈, 신축성 촉각센서, 형상적응형 로봇 그리퍼,
    스마트카를 위한 차세대 인포메틱스 연구 등을 진행하고 있습니다.

recruit:
  en: >-
    We are actively recruiting self-motivated M.S./Ph.D. students and undergraduate researchers
    interested in immersive VR/AR, human-computer interaction, next-generation haptic interfaces,
    embedded systems and soft robotics.
  ko: 몰입형 VR/AR 시스템, 인간-컴퓨터 상호작용, 차세대 촉각 인터페이스, 임베디드 시스템, 소프트 로봇을 함께 연구할 학부 연구생 · 대학원생을 모집합니다.

